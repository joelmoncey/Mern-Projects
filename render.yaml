services:
  - type: web
    name: quiz-gram-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_TELEGRAM_IDS
        sync: false
      - key: CLIENT_URL
        sync: false

  - type: web
    name: quiz-gram-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_BOT_USERNAME
        sync: false
      - key: VITE_APP_SHORT_NAME
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
