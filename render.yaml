services:
  - type: web
    name: quiz-gram-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_TELEGRAM_IDS
        sync: false
      # Vercel client URL(s), comma-separated, no trailing slash
      - key: CLIENT_URL
        sync: false
